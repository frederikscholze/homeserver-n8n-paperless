<svg xmlns="http://www.w3.org/2000/svg" width="900" height="836" viewBox="0 0 900 836" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Architektur: Server mit n8n und Paperless-ngx</title>
<desc>Besucher, Laptop und Let's Encrypt sprechen mit dem Nginx Proxy Manager auf einem virtuellen Netcup-Server mit Debian 13. Der Proxy leitet Anfragen an n8n und Paperless-ngx weiter. Paperless nutzt PostgreSQL und Redis. Ein Sicherungsskript legt Archive ab, die manuell auf den Laptop kopiert werden.</desc>
